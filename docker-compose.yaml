services:
  # ========== СЕТЬ ==========
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - app-network

  # ========== ИНФРАСТРУКТУРА ==========
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --overprovisioned
      - --kafka-addr 0.0.0.0:9092
      - --advertise-kafka-addr redpanda:9092
      - --pandaproxy-addr 0.0.0.0:8085
      - --advertise-pandaproxy-addr redpanda:8085
      - --set
      - redpanda.auto_create_topics_enabled=true
      - --default-log-level=error
    ports:
      - "9092:9092"
      - "9644:9644"
      - "8085:8085"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    volumes:
      - redis_data:/data

  # ========== KEYCLOAK & AUTH ==========
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    container_name: keycloak
    ports:
      - "8082:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-myadmin}
      KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL:-INFO}
      KC_EMAIL_ENABLED: "true"
      KC_EMAIL_HOST: mailhog
      KC_EMAIL_PORT: 1025
      KC_EMAIL_FROM: noreply@myapp.local
      KC_EMAIL_FROM_DISPLAY_NAME: "My App Auth"
      KC_EMAIL_AUTH_ENABLED: "false"
      KC_EMAIL_SSL_ENABLED: "false"
      KC_EMAIL_STARTTLS_ENABLED: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_URL: http://158.160.90.48:8082
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_STRICT_TRANSPORT_SECURITY: "disabled"
    volumes:
      - ./keycloak-export:/opt/keycloak/data/import:ro
      - ./keycloak-themes:/opt/keycloak/themes:ro
      - keycloak_data:/opt/keycloak/data
    command: start-dev --import-realm --hostname-strict=false --http-enabled=true
    depends_on:
      mailhog:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "/opt/keycloak/bin/kc.sh", "show-config"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mailhog:
    image: axllent/mailpit:latest
    container_name: mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    networks:
      - app-network

  # ========== AUTH SERVICE ==========
  auth-service:
    build: ../auth_service
    container_name: auth-service
    ports:
      - "8000:8000"
    # env_file закомментирован или указывает на необязательный файл
    # env_file:
    #   - ../auth_service/.env
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      - ENVIRONMENT=${AUTH_ENVIRONMENT:-development}
      - CORS_ORIGINS=${AUTH_CORS_ORIGINS:-["http://localhost:3000"]}
      - KEYCLOAK_BASE_URL=${AUTH_KEYCLOAK_URL:-http://keycloak:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-myrealm}
      - KEYCLOAK_CLIENT_ID=${AUTH_KEYCLOAK_CLIENT_ID:-auth-service}
      - KEYCLOAK_CLIENT_SECRET=${AUTH_KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-myadmin}
      - KEYCLOAK_ADMIN_CLIENT_ID=${AUTH_KEYCLOAK_ADMIN_CLIENT_ID:-admin-cli}
      - REFRESH_TOKEN_MAX_AGE=${AUTH_REFRESH_TOKEN_MAX_AGE:-2592000}
      - SMTP_HOST=${AUTH_SMTP_HOST:-mailhog}
      - SMTP_PORT=${AUTH_SMTP_PORT:-1025}
      - REDPANDA_BOOTSTRAP_SERVERS=redpanda:9092
    depends_on:
      keycloak:
        condition: service_healthy
      mailhog:
        condition: service_started
      redpanda:
        condition: service_healthy
    networks:
      - app-network

  # ========== PROFILE SERVICE ==========
  profile-service:
    build: ../profile_service
    container_name: profile-service
    restart: unless-stopped
    ports:
      - "8001:8000"
    # env_file закомментирован
    # env_file:
    #   - ../profile_service/.env
    environment:
      - KEYCLOAK_URL=${PROFILE_KEYCLOAK_URL:-http://keycloak:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-myrealm}
      - KEYCLOAK_CLIENT_ID=${PROFILE_KEYCLOAK_CLIENT_ID:-account}
      - KEYCLOAK_CLIENT_SECRET=${PROFILE_KEYCLOAK_CLIENT_SECRET}
      - DATABASE_URL=${PROFILE_DATABASE_URL:-postgresql://profile_user:profile_pass@postgres-profile:5432/profile_db}
      - REDPANDA_BOOTSTRAP_SERVERS=redpanda:9092
      - REDPANDA_CONSUMER_GROUP=${PROFILE_REDPANDA_CONSUMER_GROUP:-profile-service-group}
      - MEDIA_SERVICE_URL=${PROFILE_MEDIA_SERVICE_URL:-http://media-service:8000}
      - MEDIA_SERVICE_TOKEN=${PROFILE_MEDIA_SERVICE_TOKEN:-dev-profile-token}
      - SERVICE_ID=${PROFILE_SERVICE_ID:-profile-service}
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      postgres-profile:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-profile:
    image: postgres:15-alpine
    container_name: postgres-profile
    restart: unless-stopped
    environment:
      - POSTGRES_USER=profile_user
      - POSTGRES_PASSWORD=profile_pass
      - POSTGRES_DB=profile_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_profile_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile_user -d profile_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== PROJECT SERVICE ==========
  project-service:
    build: ../project_service
    container_name: project-service
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - DATABASE_DSN=postgresql://user:password@postgres-project:5432/project_db
      - KAFKA_BOOTSTRAP=redpanda:9092
      - DATABASE_MIN_CONNECTIONS=1
      - DATABASE_MAX_CONNECTIONS=10
      - KAFKA_TOPIC_ANSWERS=project-answers
      - KAFKA_TOPIC_COMMENTS=project-comments
      - KAFKA_TOPIC_PROFILE=user.created
      - KAFKA_TOPIC_EVENTS=project-events
      - KAFKA_GROUP_ID=project-service
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8000
      - LOG_LEVEL=INFO
    depends_on:
      postgres-project:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/project/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: [
        "sh",
        "-c",
        "echo 'Running migrations...' && uv run -m src.main migrate
        2>/dev/null || echo 'Migrations already applied, continuing...' &&
        echo 'Starting project service...' && uv run -m src.main run",
      ]

  postgres-project:
    image: postgres:15-alpine
    container_name: postgres-project
    restart: unless-stopped
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=project_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_project_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d project_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== FEED SERVICE (ELIXIR) ==========
  feed-service:
    build: ../feed_service
    container_name: feed-service
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PHX_SERVER=true
      - PORT=4000
      - PHX_HOST=158.160.90.48
      - DATABASE_URL=ecto://feed_user:feed_pass@postgres-feed:5432/feed_db
      - SECRET_KEY_BASE=${FEED_SECRET_KEY_BASE:?Missing SECRET_KEY_BASE}
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_GROUP_ID=feed-service
      - MEDIA_SERVICE_URL=http://media-service:8000
      - MEDIA_SERVICE_TOKEN=${FEED_MEDIA_SERVICE_TOKEN:-dev-feed-token}
      - PROJECT_SERVICE_URL=http://project-service:8000
      - PROFILE_SERVICE_URL=http://profile-service:8000
      - MIX_ENV=prod
      - LANG=C.UTF-8
      - LOG_LEVEL=info
    depends_on:
      postgres-feed:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-feed:
    image: postgres:15-alpine
    container_name: postgres-feed
    restart: unless-stopped
    environment:
      - POSTGRES_USER=feed_user
      - POSTGRES_PASSWORD=feed_pass
      - POSTGRES_DB=feed_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_feed_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feed_user -d feed_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== MEDIA SERVICE (ELIXIR) ==========
  media-service:
    build: ../media_service
    container_name: media-service
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      - PHX_SERVER=true
      - PORT=8000
      - PHX_HOST=158.160.90.48
      - DATABASE_URL=ecto://media_user:media_pass@postgres-media:5432/media_db
      - SECRET_KEY_BASE=${MEDIA_SECRET_KEY_BASE:?Missing MEDIA_SECRET_KEY_BASE}
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_GROUP_ID=media-service
      - MIX_ENV=prod
      - LANG=C.UTF-8
      - LOG_LEVEL=info
      - MINIO_ENDPOINT=minio:9000
      - MINIO_HOST=minio
      - MINIO_API_PORT=9000
      # Public host for presigned URLs — must be reachable by the browser.
      # Override with your domain in production (e.g. s3.example.com).
      - MINIO_PUBLIC_HOST=${MINIO_PUBLIC_HOST:-158.160.90.48}
      - MINIO_PUBLIC_PORT=${MINIO_PUBLIC_PORT:-9000}
      # Gateway base URL for server-side upload proxy URLs returned to the browser.
      # The browser will PUT the file to <this>/api/v1/media/me/uploads/{id}/data.
      - MEDIA_PUBLIC_GATEWAY_URL=${MEDIA_PUBLIC_GATEWAY_URL:-http://158.160.90.48:8080}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      # runtime.exs checks MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (not MINIO_ACCESS_KEY/SECRET_KEY)
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=media
      - PROJECT_SERVICE_URL=http://project-service:8000
      - PROFILE_SERVICE_URL=http://profile-service:8000
      - MEDIA_SERVICE_TOKENS=feed-service:${FEED_MEDIA_SERVICE_TOKEN:-dev-feed-token},profile-service:${PROFILE_MEDIA_SERVICE_TOKEN:-dev-profile-token}
    depends_on:
      postgres-media:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-media:
    image: postgres:15-alpine
    container_name: postgres-media
    restart: unless-stopped
    environment:
      - POSTGRES_USER=media_user
      - POSTGRES_PASSWORD=media_pass
      - POSTGRES_DB=media_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_media_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_user -d media_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/media &&
        printf '{\"CORSRules\":[{\"AllowedOrigins\":[\"*\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\",\"DELETE\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]}' > /tmp/cors.json &&
        mc cors set local/media /tmp/cors.json &&
        echo 'MinIO bucket and CORS ready'
      "
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ========== RESPONSE SERVICE ==========
  postgres-response:
    image: postgres:15-alpine
    container_name: postgres-response
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=response_service
    ports:
      - "5437:5432"
    volumes:
      - postgres_response_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d response_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  response-service:
    build: ../response_service
    container_name: response-service
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres-response:5432/response_service
      - MIGRATIONS_DATABASE_URL=postgresql://postgres:postgres@postgres-response:5432/response_service
      - RUN_DB_MIGRATIONS_ON_STARTUP=true
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_CONSUMER_GROUP=response-service-group
      - MEDIA_SERVICE_URL=http://media-service:8000
      - LOG_LEVEL=INFO
    depends_on:
      postgres-response:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ========== GATEWAY ==========
  api-gateway:
    build: ../apigateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started
      profile-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      feed-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      response-service:
        condition: service_healthy
    networks:
      - app-network

  # ========== FRONTEND ==========
  frontend:
    build:
      context: ../frontend
      target: dev
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    volumes:
      - ../frontend:/frontend
      - /frontend/node_modules
    depends_on:
      - api-gateway
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redpanda_data:
  redis_data:
  # mailhog_data: replaced by mailpit (no persistent volume needed)
  keycloak_data:
  postgres_profile_data:
  postgres_project_data:
  postgres_feed_data:
  postgres_media_data:
  postgres_response_data:
  minio_data:
