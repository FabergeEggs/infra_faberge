  # ========== GATEWAY ==========
  api-gateway:
    build: ../apigateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - profile-service
      - project-service
    networks:
      - app-network

  # ========== FRONTEND ==========
  frontend:
    build:
      context: ../frontend
      target: dev
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    volumes:
      - ../frontend:/frontend
      - /frontend/node_modules
    depends_on:
      - api-gateway
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redpanda_data:
  redis_data:
  mailhog_data:
  keycloak_data:
  postgres_profile_data:
  postgres_project_data:
  # postgres_feed_data: